name: Control 360 · Validación técnica
on:
  pull_request:
    paths:
      - 'control360/**'
      - '.github/workflows/yacusol-control360-qa.yml'
      - 'control360/catalogo-consistencia.mjs'
  push:
    branches: [main]
    paths:
      - 'control360/**'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisión estática
        run: node control360/qa-static.mjs
      - name: Obtener catálogo oficial de YACUSOL (público)
        uses: actions/checkout@v4
        with:
          repository: Energeticos2023/YACUSOL
          ref: main
          path: official-catalog
      - name: Comprobar precios entre repositorios
        run: node control360/catalogo-consistencia.mjs
